<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#181A20" />
      <stop offset="60%" stop-color="#0B0C10" />
      <stop offset="100%" stop-color="#040507" />
    </radialGradient>

    <!-- Metallic Copper Arc Gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8590C" />
      <stop offset="35%" stop-color="#FF922B" />
      <stop offset="55%" stop-color="#FFD8A8" />
      <stop offset="70%" stop-color="#E8590C" />
      <stop offset="100%" stop-color="#7A2200" />
    </linearGradient>

    <!-- Chrome Ribbon Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="25%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="90%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glass Fill Gradient -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="url(#bgGlow)" />

  <!-- 3D Fluid Liquid Torus & Metallic Ribbon Geometry -->
  <g opacity="0.95">
    <!-- Copper Glow Ribbon (Left & Bottom) -->
    <path d="M -100 800 C 150 950, 280 600, 150 400 C 80 300, -80 350, -100 800 Z" fill="url(#copperGrad)" filter="url(#softGlow)" opacity="0.8" />
    
    <!-- Large Sweeping Fluid Chrome Ribbon -->
    <path d="M -50 900 C 200 1050, 450 850, 750 880 C 1050 910, 1150 500, 950 300 C 800 150, 500 100, 250 180 C 50 250, -150 450, -50 900 Z" fill="none" stroke="url(#chromeGrad)" stroke-width="140" stroke-linecap="round" opacity="0.6" />

    <!-- Iridescent Inner Flow Lines -->
    <path d="M -20 850 C 180 980, 400 820, 680 840 C 950 860, 1080 480, 900 320 C 780 190, 480 140, 280 200" fill="none" stroke="url(#copperGrad)" stroke-width="38" stroke-linecap="round" opacity="0.85" />
    <path d="M 50 820 C 220 940, 380 800, 620 820 C 850 840, 980 480, 840 330" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Ambient Light Reflection Behind Card -->
  <circle cx="200" cy="550" r="220" fill="#E8590C" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="850" cy="450" r="180" fill="#64748B" opacity="0.2" filter="url(#softGlow)" />

  <!-- Center Frosted Glass Card (1:1 Proportional Fit) -->
  <g filter="url(#dropShadow)">
    <rect x="190" y="140" width="620" height="720" rx="44" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.5" />
    
    <!-- Inner Glass Highlight Sheen -->
    <rect x="192" y="142" width="616" height="300" rx="42" fill="url(#glassBorder)" opacity="0.08" />

    <!-- Card Top Header -->
    <text x="260" y="222" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="1.5">WEBSITES</text>
    <text x="260" y="250" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="500" font-size="18" fill="rgba(255, 255, 255, 0.75)">2026</text>

    <text x="740" y="222" text-anchor="end" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#FFFFFF">Let's create</text>

    <!-- Main Bold Headline -->
    <text x="260" y="475" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="800" font-size="62" fill="#FFFFFF" letter-spacing="-1.8">Your website</text>
    <text x="260" y="550" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="800" font-size="62" fill="#FFFFFF" letter-spacing="-1.8">has one job.</text>

    <!-- Card Footer -->
    <text x="260" y="790" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="500" font-size="18" fill="rgba(255, 255, 255, 0.8)">@kausar.build</text>
  </g>
</svg>
