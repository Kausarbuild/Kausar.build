<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="dashBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="60%" stop-color="#040609" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Glowing Cyan/Blue Sine Wave Filter -->
    <filter id="neonGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tablet Rim Glow -->
    <linearGradient id="tabletBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Tablet Surface -->
    <linearGradient id="tabletSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#070A12" stop-opacity="0.95" />
    </linearGradient>

    <!-- Wave Area Gradient -->
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Pitch Black Canvas -->
  <rect width="1000" height="1000" fill="url(#dashBg)" />

  <!-- Bottom Reflection Glow -->
  <ellipse cx="500" cy="880" rx="380" ry="40" fill="#2563EB" opacity="0.15" filter="blur(35px)" />

  <!-- Floating Glass Tablet Frame -->
  <g transform="translate(60, 115)">
    <!-- Tablet Outer Shell with Glowing Edge -->
    <rect width="880" height="745" rx="36" fill="url(#tabletSurface)" stroke="url(#tabletBorder)" stroke-width="1.5" />

    <!-- Left App Sidebar (w: 60px) -->
    <g transform="translate(24, 30)">
      <!-- Logo Mark (three diagonal rounded lines) -->
      <g fill="#FFFFFF">
        <rect x="0" y="0" width="4" height="14" rx="2" transform="rotate(-25 0 0)" />
        <rect x="9" y="0" width="4" height="16" rx="2" transform="rotate(-25 9 0)" />
        <rect x="18" y="0" width="4" height="12" rx="2" transform="rotate(-25 18 0)" />
      </g>

      <!-- Active Home Icon in Blue Pill -->
      <rect x="-4" y="65" width="36" height="36" rx="10" fill="#2563EB" />
      <path d="M 9 90 L 14 77 L 19 90 Z" fill="#FFFFFF" />

      <!-- Other Sidebar Nav Icons -->
      <circle cx="14" cy="140" r="8" fill="none" stroke="#64748B" stroke-width="1.8" />
      <path d="M 14 135 L 14 140 L 18 140" stroke="#64748B" stroke-width="1.5" />

      <circle cx="14" cy="195" r="5" fill="none" stroke="#64748B" stroke-width="1.8" />
      <path d="M 6 210 C 6 205, 22 205, 22 210" fill="none" stroke="#64748B" stroke-width="1.8" />

      <rect x="8" y="250" width="4" height="14" rx="1" fill="#64748B" />
      <rect x="14" y="244" width="4" height="20" rx="1" fill="#64748B" />
      <rect x="20" y="254" width="4" height="10" rx="1" fill="#64748B" />

      <rect x="6" y="310" width="16" height="12" rx="2" fill="none" stroke="#64748B" stroke-width="1.8" />
      <path d="M 6 312 L 14 318 L 22 312" fill="none" stroke="#64748B" stroke-width="1.5" />

      <circle cx="14" cy="370" r="8" fill="none" stroke="#64748B" stroke-width="1.8" />
    </g>

    <!-- Top Navigation Bar Inside Tablet -->
    <g transform="translate(115, 30)">
      <!-- Search Input -->
      <rect width="215" height="28" rx="8" fill="#1E293B" opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748B">Search anything...</text>
      <circle cx="195" cy="14" r="4" fill="none" stroke="#64748B" stroke-width="1.2" />
      <line x1="198" y1="17" x2="202" y2="21" stroke="#64748B" stroke-width="1.2" />

      <!-- Notification Bell & User Pill -->
      <circle cx="590" cy="14" r="5" fill="none" stroke="#94A3B8" stroke-width="1.5" />
      <rect x="620" y="0" width="44" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="642" y="18" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">KS</text>
    </g>

    <!-- Main Hero Headline (Left Column) -->
    <g transform="translate(115, 125)" font-family="Plus Jakarta Sans, Inter, sans-serif">
      <text x="0" y="65" font-weight="800" font-size="62" fill="#FFFFFF" letter-spacing="-1.5">Beautiful</text>
      <text x="0" y="135" font-weight="800" font-size="62" fill="#FFFFFF" letter-spacing="-1.5">isn't enough.</text>
      <text x="0" y="215" font-weight="500" font-size="34" fill="#94A3B8" letter-spacing="-0.5">It has to</text>
      <text x="0" y="255" font-weight="500" font-size="34" fill="#94A3B8" letter-spacing="-0.5">convert.</text>
    </g>

    <!-- Right Side Dashboard Card: Performance Overview -->
    <g transform="translate(515, 80)">
      <!-- Card Container -->
      <rect width="320" height="200" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1" />
      
      <!-- Card Header -->
      <text x="16" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Performance Overview</text>
      <rect x="235" y="14" width="70" height="18" rx="6" fill="#1E293B" />
      <text x="270" y="26" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94A3B8">This month ▾</text>

      <!-- Revenue Metric -->
      <text x="16" y="55" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B">Total Revenue</text>
      <text x="16" y="80" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">$48,290</text>
      <text x="110" y="78" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">↑ 18.6%</text>

      <!-- Glowing Neon Wave -->
      <path d="M 16 125 C 50 145, 80 100, 120 120 C 160 140, 200 95, 240 115 C 270 125, 290 105, 305 110" fill="none" stroke="#38BDF8" stroke-width="2.5" filter="url(#neonGlow)" />

      <!-- Secondary Metrics -->
      <line x1="16" y1="150" x2="304" y2="150" stroke="#1F2937" stroke-width="1" />
      <text x="16" y="170" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B">Sessions</text>
      <text x="16" y="186" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">124,890</text>
      <text x="75" y="186" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">↑ 12.4%</text>

      <text x="175" y="170" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B">Conversion Rate</text>
      <text x="175" y="186" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3.82%</text>
      <text x="218" y="186" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">↑ 8.7%</text>
    </g>

    <!-- Bottom Left Card: Revenue Wave Chart with Milestone Dot -->
    <g transform="translate(115, 410)">
      <rect width="370" height="170" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1" />
      
      <text x="16" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">Revenue</text>
      <text x="16" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">$48,290</text>
      <text x="108" y="46" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">↑ 18.6%</text>

      <!-- Chart Wave with glowing milestone point -->
      <path d="M 30 135 C 70 145, 100 110, 145 125 C 190 140, 230 95, 275 110 C 310 120, 335 90, 345 92" fill="none" stroke="#38BDF8" stroke-width="2.5" filter="url(#neonGlow)" />
      
      <!-- Glowing Milestone Dot -->
      <circle cx="345" cy="92" r="5" fill="#FFFFFF" />
      <circle cx="345" cy="92" r="10" fill="#38BDF8" opacity="0.4" />

      <!-- Dates -->
      <text x="30" y="156" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#475569">May 18</text>
      <text x="110" y="156" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#475569">May 25</text>
      <text x="190" y="156" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#475569">Jun 1</text>
      <text x="260" y="156" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#475569">Jun 8</text>
      <text x="325" y="156" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#475569">Jun 18</text>
    </g>

    <!-- Bottom Left Feature Banner -->
    <g transform="translate(115, 600)">
      <rect width="370" height="60" rx="14" fill="#111827" stroke="#1E293B" stroke-width="1" />
      
      <rect x="14" y="12" width="36" height="36" rx="10" fill="#2563EB" />
      <path d="M 22 30 C 26 24, 30 36, 34 28 C 38 20, 42 32, 44 26" fill="none" stroke="#FFFFFF" stroke-width="1.8" />

      <text x="62" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Automate. Analyze. Accelerate.</text>
      <text x="62" y="44" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94A3B8">Everything you need to grow.</text>

      <text x="345" y="34" font-family="Plus Jakarta Sans, sans-serif" font-size="14" fill="#94A3B8">→</text>
    </g>

    <!-- Bottom Right: Top Channels Card -->
    <g transform="translate(515, 300)">
      <rect width="320" height="200" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1" />
      
      <text x="16" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Top Channels</text>
      <text x="295" y="26" text-anchor="end" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B">View all</text>

      <!-- Channel Rows with Progress Bars -->
      <g transform="translate(16, 45)">
        <text x="24" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94A3B8">Organic Search</text>
        <text x="280" y="12" text-anchor="end" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">42%</text>
        <rect x="24" y="18" width="160" height="4" rx="2" fill="#2563EB" />

        <g transform="translate(0, 32)">
          <text x="24" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94A3B8">Paid Search</text>
          <text x="280" y="12" text-anchor="end" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">28%</text>
          <rect x="24" y="18" width="110" height="4" rx="2" fill="#2563EB" />
        </g>

        <g transform="translate(0, 64)">
          <text x="24" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94A3B8">Social Media</text>
          <text x="280" y="12" text-anchor="end" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">17%</text>
          <rect x="24" y="18" width="68" height="4" rx="2" fill="#2563EB" />
        </g>

        <g transform="translate(0, 96)">
          <text x="24" y="12" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94A3B8">Direct</text>
          <text x="280" y="12" text-anchor="end" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">8%</text>
          <rect x="24" y="18" width="35" height="4" rx="2" fill="#2563EB" />
        </g>
      </g>
    </g>

    <!-- Bottom Right: Recent Conversions Card -->
    <g transform="translate(515, 520)">
      <rect width="320" height="90" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1" />
      
      <text x="16" y="24" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Recent Conversions</text>
      <text x="295" y="24" text-anchor="end" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B">View all</text>

      <g transform="translate(16, 42)">
        <circle cx="16" cy="16" r="16" fill="#1E293B" />
        <text x="16" y="20" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">M</text>
        <circle cx="26" cy="26" r="3" fill="#22C55E" />

        <text x="42" y="14" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Michael Smith</text>
        <text x="42" y="28" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B">Premium Plan</text>

        <text x="220" y="18" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">$129.00</text>
        <text x="280" y="18" text-anchor="end" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#64748B">2m ago</text>
      </g>
    </g>
  </g>
</svg>
